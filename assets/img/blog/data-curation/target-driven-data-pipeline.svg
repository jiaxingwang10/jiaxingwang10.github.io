<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Designing What Models Learn</title>
  <desc id="desc">A target guides data intervention over a raw pool. Reference scores, diversity constraints, the allowed operator, and the budget define a reachable training distribution. Training produces a model that is evaluated on the target.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7a82"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#222" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="24" fill="#fbfafc"/>

  <text x="600" y="43" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#25242a">Designing What Models Learn</text>

  <rect x="470" y="67" width="260" height="62" rx="18" fill="#f8e9f7" stroke="#b509ac" stroke-width="2"/>
  <text x="600" y="94" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#8f0788">Target T</text>
  <text x="600" y="116" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5e4a5c">defines what improvement means</text>

  <path d="M 515 129 C 450 155, 405 160, 355 181" fill="none" stroke="#b509ac" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <path d="M 685 129 C 825 160, 975 190, 1040 245" fill="none" stroke="#b509ac" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <rect x="45" y="205" width="165" height="100" rx="18" fill="#ffffff" stroke="#b8b7bd" stroke-width="2" filter="url(#shadow)"/>
  <text x="127.5" y="243" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#25242a">Raw pool</text>
  <text x="127.5" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#66636c">p<tspan baseline-shift="sub" font-size="12">pool</tspan></text>

  <path d="M 210 255 L 255 255" stroke="#7a7a82" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="260" y="165" width="275" height="180" rx="20" fill="#ffffff" stroke="#b509ac" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="397.5" y="198" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#8f0788">Data intervention</text>
  <line x1="286" y1="213" x2="509" y2="213" stroke="#ead4e8" stroke-width="1.5"/>
  <text x="295" y="243" font-family="Inter, Arial, sans-serif" font-size="15" fill="#35333a">Reference / quality signal</text>
  <text x="295" y="271" font-family="Inter, Arial, sans-serif" font-size="15" fill="#35333a">Diversity constraint + geometry</text>
  <text x="295" y="299" font-family="Inter, Arial, sans-serif" font-size="15" fill="#35333a">Operator O + budget B</text>
  <text x="397.5" y="329" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#77727c">mixture · selection · synthesis</text>

  <path d="M 535 255 L 580 255" stroke="#7a7a82" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="585" y="205" width="220" height="100" rx="18" fill="#f7f2f8" stroke="#9e789d" stroke-width="2" filter="url(#shadow)"/>
  <text x="695" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#25242a">Reachable distribution</text>
  <text x="695" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#6e3d6b">q ∈ Q<tspan baseline-shift="sub" font-size="12">O</tspan>(B; p<tspan baseline-shift="sub" font-size="12">pool</tspan>)</text>

  <path d="M 805 255 L 850 255" stroke="#7a7a82" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="855" y="205" width="130" height="100" rx="18" fill="#ffffff" stroke="#b8b7bd" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="243" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#25242a">Train</text>
  <text x="920" y="271" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#66636c">θ<tspan baseline-shift="super" font-size="12">*</tspan><tspan baseline-shift="baseline">(q)</tspan></text>

  <path d="M 985 255 L 1025 255" stroke="#7a7a82" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1030" y="205" width="130" height="100" rx="18" fill="#f8e9f7" stroke="#b509ac" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095" y="241" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#8f0788">Evaluate</text>
  <text x="1095" y="269" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#6e3d6b">L<tspan baseline-shift="sub" font-size="11">target</tspan></text>

  <text x="600" y="394" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#55515a">Data value is realized through the model a distribution produces for a target.</text>
</svg>
