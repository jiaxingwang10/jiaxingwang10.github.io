<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc">
  <title id="title">From a bilevel objective to allocation updates</title>
  <desc id="desc">A proxy minimizes training loss and a reference minimizes target loss plus a training penalty. Their loss difference supplies domain scores for simplex projection or token scores for a Top-k mask.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs>
  <rect width="1080" height="510" rx="18" fill="#fafafa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#20252e">
    <rect x="40" y="48" width="430" height="133" rx="13" fill="#edf7f1" stroke="#71a789"/>
    <text x="64" y="82" font-size="22" font-weight="600">Proxy: θ_proxy</text>
    <text x="64" y="119" font-size="19">Minimize training loss under w</text>
    <text x="64" y="151" font-size="17" fill="#52665b">Tracks the inner training solution</text>
    <rect x="40" y="232" width="430" height="133" rx="13" fill="#fff5e9" stroke="#c69c65"/>
    <text x="64" y="266" font-size="22" font-weight="600">Reference: θ_ref</text>
    <text x="64" y="303" font-size="19">Minimize target loss + λ · training loss</text>
    <text x="64" y="335" font-size="17" fill="#77634b">Tracks the target-informed solution</text>
    <path d="M470 115 H510 V202 H540 M470 299 H510 V222 H540" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="550" y="160" width="480" height="105" rx="13" fill="#f0eef8" stroke="#a194ba"/>
    <text x="574" y="197" font-size="21" font-weight="600">Score = proxy loss − reference loss</text>
    <text x="574" y="235" font-size="18">Evaluate per domain or per token</text>
    <path d="M790 265 V300 M790 300 H652 V329 M790 300 H918 V329" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="550" y="339" width="220" height="97" rx="12" fill="#fff" stroke="#a194ba"/>
    <text x="570" y="375" font-size="21" font-weight="600">Mixture / TANDEM</text>
    <text x="570" y="410" font-size="18">Simplex projection</text>
    <rect x="792" y="339" width="238" height="97" rx="12" fill="#fff" stroke="#a194ba"/>
    <text x="812" y="375" font-size="21" font-weight="600">Selection / BLADE</text>
    <text x="812" y="410" font-size="18">Top-fP loss mask</text>
    <text x="42" y="475" font-size="17" fill="#647080">A common allocation direction; different feasible sets and update rules.</text>
  </g>
</svg>
